name: Checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: checks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm run install:ci
      - run: npm run check
      - run: npm run build
      - name: Install test browser
        if: runner.os == 'Linux'
        run: npx playwright install --with-deps --only-shell chromium
      - name: Browser workflows (desktop and mobile sizes)
        if: runner.os == 'Linux'
        run: npm run test:browser
      - name: Preserve browser test report
        if: failure() && runner.os == 'Linux'
        uses: actions/upload-artifact@v4
        with:
          name: browser-test-report
          path: |
            outputs/playwright-report
            outputs/playwright-results
          retention-days: 7
